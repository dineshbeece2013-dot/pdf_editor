# ---------------------------------------------------------------------------
# Shared location blocks — included by BOTH the HTTP and HTTPS server blocks.
#
# This file contains no `server {}` wrapper on purpose: the two blocks differ
# only in TLS and in how they treat plain HTTP, while these rules are identical.
# Deploy to /etc/nginx/pdfpro-locations.conf
# ---------------------------------------------------------------------------

# ACME (Let's Encrypt) challenges stay reachable over plain HTTP so automatic
# certificate renewal keeps working. Deploy wipes the web root, which is fine:
# certbot writes the challenge file fresh for each validation attempt.
location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    default_type "text/plain";
}

# The pdf.js worker (.mjs) needs an explicit JavaScript MIME type:
# Chrome refuses to start workers served as application/octet-stream.
location ~* \.mjs$ {
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# WebAssembly modules must be served as application/wasm or
# WebAssembly.instantiateStreaming() fails in the browser.
location ~* \.wasm$ {
    default_type application/wasm;
    expires 7d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# Hashed build assets: cache forever
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# pdf.js support files (standard fonts, cmaps, wasm, iccs)
location /pdfjs/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# Bundled application fonts
location /fonts/ {
    expires 30d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# Backend API (Express). The trailing slash is omitted from proxy_pass so the
# /api prefix is preserved. Cookies need the X-Forwarded-* headers, and the app
# decides cookie security from X-Forwarded-Proto.
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $pdfpro_forwarded_proto;
    proxy_read_timeout 30s;
}
