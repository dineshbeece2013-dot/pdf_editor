# ---------------------------------------------------------------------------
# Shared location blocks — included by BOTH the HTTP and HTTPS server blocks.
#
# This file contains no `server {}` wrapper on purpose: the two blocks differ
# only in TLS and in how they treat plain HTTP, while these rules are identical.
# Deploy to /etc/nginx/pdfpro-locations.conf
# ---------------------------------------------------------------------------

# ACME (Let's Encrypt) challenges stay reachable over plain HTTP so automatic
# certificate renewal keeps working. Deploy wipes the web root, which is fine:
# certbot writes the challenge file fresh for each validation attempt.
location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    default_type "text/plain";
}

# The pdf.js worker (.mjs) needs an explicit JavaScript MIME type:
# Chrome refuses to start workers served as application/octet-stream.
location ~* \.mjs$ {
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# WebAssembly modules must be served as application/wasm or
# WebAssembly.instantiateStreaming() fails in the browser.
location ~* \.wasm$ {
    default_type application/wasm;
    expires 7d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# Hashed build assets: cache forever
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# pdf.js support files (standard fonts, cmaps, wasm, iccs)
location /pdfjs/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# Bundled application fonts
location /fonts/ {
    expires 30d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}

# Pre-rendered policy and contact pages.
#
# These exist as real files because a crawler — and a reader whose JavaScript
# fails — must see the full text. They live in this shared file because BOTH
# server blocks need them: in Flexible SSL mode Cloudflare reaches this origin
# over plain HTTP, so the :80 block serves real visitors.
location = /privacy       { try_files /legal/privacy.html       =404; }
location = /terms         { try_files /legal/terms.html         =404; }
location = /refund-policy { try_files /legal/refund-policy.html =404; }
location = /contact       { try_files /legal/contact.html       =404; }

# Files that must stay reachable at the site root: crawler directives, the
# sitemap, and search-engine ownership files.
location = /robots.txt  { try_files $uri =404; expires 1d; }
location = /sitemap.xml { try_files $uri =404; expires 1d; }
location = /favicon.svg { try_files $uri =404; expires 7d; }
location = /favicon.png { try_files $uri =404; expires 7d; }
location = /favicon.ico  { try_files $uri =404; expires 7d; }
location = /apple-touch-icon.png { try_files $uri =404; expires 7d; }
location = /icons.svg   { try_files $uri =404; expires 7d; }

# Site-verification files. Provider filenames differ, so serve any root-level
# .xml that exists rather than pinning each one here.
location ~* ^/[A-Za-z0-9_-]*\.xml$ {
    try_files $uri =404;
}

# Backend API (Express). The trailing slash is omitted from proxy_pass so the
# /api prefix is preserved. Cookies need the X-Forwarded-* headers, and the app
# decides cookie security from X-Forwarded-Proto.
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $pdfpro_forwarded_proto;
    proxy_read_timeout 30s;
}
