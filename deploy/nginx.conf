user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types_hash_max_size 4096;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The pdf.js worker (.mjs) needs an explicit JavaScript MIME type:
        # Chrome refuses to start workers served as application/octet-stream.
        location ~* \.mjs$ {
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # WebAssembly modules must be served as application/wasm or
        # WebAssembly.instantiateStreaming() fails in the browser.
        location ~* \.wasm$ {
            default_type application/wasm;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Hashed build assets: cache forever
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # pdf.js support files (standard fonts, cmaps, wasm, iccs)
        location /pdfjs/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Bundled application fonts
        location /fonts/ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Backend API (Express). The trailing slash is omitted from proxy_pass so
        # the /api prefix is preserved. Cookies need the X-Forwarded-* headers,
        # and the app decides cookie security from X-Forwarded-Proto.
        location /api/ {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        # App shell: never cache so deploys roll out immediately
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA fallback: unknown paths serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
