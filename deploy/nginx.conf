user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types_hash_max_size 4096;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # -----------------------------------------------------------------
    # Preserve the protocol the VISITOR actually used.
    #
    # A proxy in front of us (Cloudflare in Flexible SSL mode) terminates TLS
    # for the browser but then connects to this origin over plain HTTP, and it
    # records the real scheme in X-Forwarded-Proto. If we blindly overwrite
    # that with our own $scheme, the API believes the request was insecure and
    # express-session then refuses to issue a Secure session cookie — which
    # looks to a user exactly like "login silently fails".
    #
    # This map only affects the loopback hop to the API (127.0.0.1:4000 is not
    # reachable from outside), so a client cannot spoof the header to us.
    # -----------------------------------------------------------------
    map $http_x_forwarded_proto $pdfpro_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # -----------------------------------------------------------------
    # Plain HTTP.
    #
    # A proxy in front of us (Cloudflare) may terminate TLS for the browser
    # and then talk to this origin over HTTP. Redirecting in that case would
    # bounce the browser back and forth forever, because every "https"
    # request arrives here as a plain HTTP one. So: only redirect when the
    # request did NOT already come from a proxy that handled TLS for us.
    # -----------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name digitalpdfeditor.com www.digitalpdfeditor.com 54.242.198.214;

        # Needed for the try_files rules below (and the shared location file)
        # to resolve. The HTTPS block sets the same root.
        root /usr/share/nginx/html;

        include /etc/nginx/pdfpro-locations.conf;

        location / {
            # `if` + `return` is safe in nginx (rewrite phase, no rewrite phase
            # re-entry). X-Forwarded-Proto is "https" when Cloudflare is in
            # Flexible SSL mode and already secured the visitor.
            if ($http_x_forwarded_proto != "https") {
                return 301 https://$host$request_uri;
            }

            # Same rule set as the HTTPS block below: a real file if one
            # exists, the app shell for / and /login, a genuine 404 otherwise.
            # Cloudflare in Flexible SSL mode reaches the origin over plain
            # HTTP, so this block serves real visitors and must not be allowed
            # to fall back to serving the homepage for every path.
            error_page 404 /404.html;

            location = /       { try_files /index.html =404; }
            location = /login  { try_files /index.html =404; }
            location = /404.html {
                internal;
                root /usr/share/nginx/html;
            }

            try_files $uri $uri/ =404;
        }
    }

    # -----------------------------------------------------------------
    # HTTPS: the real site.
    # -----------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name digitalpdfeditor.com www.digitalpdfeditor.com 54.242.198.214;

        # Managed by certbot; renews automatically every ~60 days.
        ssl_certificate     /etc/letsencrypt/live/digitalpdfeditor.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/digitalpdfeditor.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Tell browsers to stay on HTTPS. Note this is cached hard by clients —
        # remove the line (and wait it out) if you ever need to fall back to HTTP.
        add_header Strict-Transport-Security "max-age=31536000" always;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/pdfpro-locations.conf;

        # App shell: never cache so deploys roll out immediately.
        # `add_header` in a location REPLACES the inherited set, so HSTS has
        # to be repeated here.
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # The app shell, for the only two routes the SPA owns. Named
        # explicitly rather than used as a catch-all: serving index.html for
        # *every* path means a typo or a scanner probing /wp-admin still gets
        # 200, which tells search engines every URL on the domain is real and
        # wastes crawl budget. That is a "soft 404".
        # (The legal pages, robots.txt and the verification files are defined
        # in the shared pdfpro-locations.conf, which both blocks include.)
        location = /      { try_files /index.html =404; }
        location = /login { try_files /index.html =404; }

        # Any other path that maps to a real file (a font, an icon, a support
        # file) is still served — only genuinely missing paths 404.
        location / {
            try_files $uri $uri/ =404;
        }

        # Body served with that 404. `internal` keeps it from being
        # requested directly.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
