<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These are the defaults so a dev build and a crawler that never runs
      JavaScript still see a described page. `scripts/inject-seo.mjs` rewrites
      them at build time from src/seo/content.ts, which is the single source of
      truth — edit the copy there, not here.
    -->
    <title>Free Online PDF Editor — Edit, Sign &amp; Annotate PDFs</title>
    <meta
      name="description"
      content="Edit PDFs free in your browser. Add text, images, shapes and signatures, highlight, redact, crop and annotate. No sign-up, no upload to a server, and one free edit every day."
    />
    <link rel="canonical" href="https://digitalpdfeditor.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDF Editor Pro" />
    <meta property="og:title" content="Free Online PDF Editor — Edit, Sign &amp; Annotate PDFs" />
    <meta
      property="og:description"
      content="Edit PDFs free in your browser. Add text, images, shapes and signatures, highlight, redact, crop and annotate. No sign-up and no file leaves your device."
    />
    <meta property="og:url" content="https://digitalpdfeditor.com/" />
    <meta name="twitter:card" content="summary" />

    <!--
      With JavaScript off the app never mounts, so the pre-rendered content
      in #root *is* the page: reveal it (this rule out-specifies the app
      stylesheet's hide rule) and let the document scroll again.
    -->
    <noscript>
      <style>
        html, body, #root { height: auto; overflow: auto; }
        html body #root .seo-prerender {
          display: block;
          max-width: 64rem;
          margin: 0 auto;
          padding: 2rem 1rem;
        }
        html body #root .seo-prerender section,
        html body #root .seo-prerender footer { margin-bottom: 2.5rem; }
        html body #root .seo-prerender nav { display: flex; flex-wrap: wrap; gap: 1rem; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
